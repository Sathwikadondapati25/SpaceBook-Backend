services:
  - type: web
    name: spacebook-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
        length: 64
      - key: CORS_ORIGINS
        value: https://spacebook-frontend.onrender.com,https://spacebook-frontend.vercel.app
      - key: ORGANIZER_INVITE_CODE
        generateValue: true
        length: 24
