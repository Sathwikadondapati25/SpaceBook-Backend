services:
  - type: web
    name: spacebook-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: spacebook-db
          property: jdbcUri
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: spacebook-db
          property: username
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: spacebook-db
          property: password
      - key: JWT_SECRET
        generateValue: true
        length: 64
      - key: CORS_ORIGINS
        value: https://spacebook-frontend.onrender.com,https://spacebook-frontend.vercel.app
      - key: ORGANIZER_INVITE_CODE
        generateValue: true
        length: 24

databases:
  - name: spacebook-db
    databaseName: spacebook
    user: spacebook_user
    plan: free
